[project]
name = "bsuite_testing"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "jamesrj_desktop", email = "james.rudd.jones@gmail.com"},
    {name = "", email = ""},
]
dependencies = [
    "flashbax>=0.1.2",
    "wandb>=0.18.3",
    "ml-collections>=0.1.1",
    "lxm3>=0.4.2",
    "jax[cuda12_pip]>=0.4.30",
    "dm-env>=1.6",
    "scikit-image>=0.24.0",
    "pandas>=2.2.3",
    "termcolor>=2.5.0",
    "distrax>=0.1.5",
    "dm-haiku>=0.0.13",
    "rlax>=0.1.6",
    "tqdm>=4.66.6",
    "duckdb>=1.1.2",
    "pyarrow>=18.0.0",
    "seaborn>=0.13.2",
]
requires-python = "==3.9.*"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

 [[tool.pdm.source]]
 name = "jax_cuda"
 url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
 verify_ssl = true
 type = "find_links"
